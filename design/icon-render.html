<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>
  html,body { margin:0; padding:0; width:1024px; height:1024px; overflow:hidden; }
  svg { display:block; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BB0F7"/>
      <stop offset="1" stop-color="#0B4DA6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 显示器：整体 248~782，视觉中心约 515，与画布中心 512 对齐 -->
  <rect x="200" y="248" width="624" height="448" rx="52"
        fill="none" stroke="#ffffff" stroke-width="58"/>

  <!-- 底座 -->
  <rect x="452" y="736" width="120" height="46" rx="23" fill="#ffffff"/>

  <!-- 连接波纹：置于屏幕内左下，起点留足内边距避免与边框粘连 -->
  <g fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round">
    <circle cx="312" cy="600" r="7"/>
    <path d="M312 505 a95 95 0 0 1 95 95"/>
    <path d="M312 410 a190 190 0 0 1 190 190"/>
  </g>
</svg>
</body>
</html>
