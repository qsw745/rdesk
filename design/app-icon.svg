 <path d="M0 0 L0 74 L17.5 58 L29 85 L43 79 L31.5 52.5 L54 52.5 Z" transform="translate(424 344) scale(3.25)" fill="url(#warm)" stroke="#fff" stroke-width="11" stroke-linejoin="round" paint-order="stroke"/>
</g></svg>
