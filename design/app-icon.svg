<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>RDesk 应用图标</title>
  <desc>蓝色渐变底，白色显示器轮廓与向外发射的连接波纹，表示远程投屏与操控。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BB0F7"/>
      <stop offset="1" stop-color="#0B4DA6"/>
    </linearGradient>
  </defs>

  <!-- 底色：App Store 图标不得含透明通道，必须铺满 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 显示器轮廓 -->
  <rect x="238" y="250" width="548" height="392" rx="44"
        fill="none" stroke="#ffffff" stroke-width="54"/>

  <!-- 底座 -->
  <rect x="454" y="694" width="116" height="44" rx="22" fill="#ffffff"/>

  <!-- 连接波纹：自屏幕左下角向外发射 -->
  <g fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round">
    <circle cx="332" cy="566" r="6"/>
    <path d="M332 476 a90 90 0 0 1 90 90"/>
    <path d="M332 386 a180 180 0 0 1 180 180"/>
  </g>
</svg>
