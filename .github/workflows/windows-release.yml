name: Windows 安装包
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: 构建 Windows x64
        working-directory: flutter_client
        run: |
          flutter pub get
          flutter build windows --release --build-name=2.1.1 --build-number=15
      - name: 加入运行库并验证启动
        shell: pwsh
        run: |
          $bundle = Resolve-Path 'flutter_client/build/windows/x64/runner/Release'
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC" -Directory -Recurse | Where-Object { $_.Name -eq 'Microsoft.VC143.CRT' -and $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (!$crt) { throw 'VC++ x64 runtime missing' }
          Copy-Item "$($crt.FullName)/*.dll" $bundle
          $process = Start-Process "$bundle/rdesk.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "App exited: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
          New-Item dist -ItemType Directory -Force
          Compress-Archive -Path "$bundle/*" -DestinationPath dist/RDesk-2.1.1-windows-x64-portable.zip
      - name: 生成并测试安装程序
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $dest = Join-Path $env:RUNNER_TEMP 'rdesk-install-smoke'
          $setup = Start-Process 'dist/RDesk-2.1.1-windows-x64-setup.exe' -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dest" -PassThru -Wait
          if ($setup.ExitCode -ne 0 -or !(Test-Path "$dest/rdesk.exe")) { throw 'Installation failed' }
          Get-FileHash dist/* -Algorithm SHA256 | Format-Table -AutoSize | Out-File dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rdesk-windows-2.1.1
          path: dist/*
          retention-days: 14
          if-no-files-found: error
