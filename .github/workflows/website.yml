name: 上传本地生成的官网
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['deploy/site/**', '.github/workflows/website.yml']
permissions:
  contents: read
concurrency:
  group: website
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/site
      - uses: actions/deploy-pages@v4
        id: deployment
