# Include inside qisw.top's HTTPS server on 101.37.21.147.
location = /rdesk { return 301 /rdesk/; }
# Keep historical installed-client download links available during migration.
location = /rdesk/dl/RDesk-2.1.0.apk {
    alias /usr/share/nginx/html/rdesk/dl/RDesk-2.1.0.apk;
    add_header Content-Disposition "attachment";
}
location = /rdesk/dl/RDesk-2.1.0.dmg {
    alias /usr/share/nginx/html/rdesk/dl/RDesk-2.1.0.dmg;
    add_header Content-Disposition "attachment";
}
location ^~ /rdesk/ {
    proxy_pass https://124.223.200.182;
    proxy_ssl_server_name on;
    proxy_ssl_name wenheng-origin.internal;
    proxy_ssl_trusted_certificate /etc/nginx/ssl/wenheng-origin.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 1;
    proxy_http_version 1.1;
    proxy_set_header Host wenheng-origin.internal;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
}
